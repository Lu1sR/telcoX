version: '3.9'

services:
  # ===========================================
  # MySQL Database Service
  # ===========================================
  mysql:
    image: mysql:8.0
    container_name: telcox_mysql
    restart: unless-stopped
    
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-UTC}
    
    ports:
      - "3306:3306"
    
    volumes:
      # Named volume for persistent MySQL data
      - mysql_data:/var/lib/mysql
      # Optional: custom MySQL configuration
      # - ./database/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      # Optional: initialization scripts (run once on first startup)
      # - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    
    networks:
      - telcox_network
    
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  # ===========================================
  # Django Backend Service
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telcox_backend
    restart: unless-stopped
    
    environment:
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DB_ENGINE: ${DB_ENGINE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE}
      TZ: ${TZ:-UTC}
    
    ports:
      - "8010:8000"
    
    volumes:
      # Mount code for development (live reload)
      - ./backend:/app
      # Prevent overwriting installed packages
      - backend_static:/app/staticfiles
    
    networks:
      - telcox_network
    
    depends_on:
      mysql:
        condition: service_healthy
    
    command: >
      sh -c "
        echo 'Waiting for MySQL...' &&
        /app/scripts/wait_for_db.sh mysql 3306 &&
        echo 'Running migrations...' &&
        python manage.py makemigrations &&
        python manage.py migrate &&
        echo 'Creating superuser...' &&
        python manage.py shell -c \"
        from django.contrib.auth import get_user_model;
        User = get_user_model();
        if not User.objects.filter(username='admin').exists():
            User.objects.create_superuser('admin', 'admin@telcox.com', 'admin123')
        \" || true &&
        echo 'Seeding database...' &&
        python scripts/seed_data.py &&
        echo 'Collecting static files...' &&
        python manage.py collectstatic --noinput &&
        echo 'Starting development server...' &&
        python manage.py runserver 0.0.0.0:8000
      "

  # ===========================================
  # Angular Frontend Service
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: telcox_frontend
    restart: unless-stopped
    
    environment:
      NODE_ENV: development
    
    ports:
      - "4200:4200"
    
    volumes:
      # Mount code for development (live reload)
      - ./frontend:/app
      # Prevent overwriting node_modules
      - frontend_node_modules:/app/node_modules
    
    networks:
      - telcox_network
    
    depends_on:
      - backend
    
    command: npm start -- --host 0.0.0.0 --poll 2000

# ===========================================
# Named Volumes
# ===========================================
volumes:
  mysql_data:
    driver: local
    name: telcox_mysql_data
  backend_static:
    driver: local
    name: telcox_backend_static
  frontend_node_modules:
    driver: local
    name: telcox_frontend_node_modules

# ===========================================
# Networks
# ===========================================
networks:
  telcox_network:
    driver: bridge
    name: telcox_network
