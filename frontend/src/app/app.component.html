<!-- App Root Template -->
<div class="app-container">
  <!-- Loading Indicator -->
  <div *ngIf="loading$ | async" class="loading-overlay">
    <div class="loading-spinner">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="container">
      <div class="header-content">
        <h1>{{ title }}</h1>
        <nav class="main-nav">
          <a routerLink="/usage" routerLinkActive="active">My Usage</a>
          <a routerLink="/home" routerLinkActive="active">Home</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="app-main">
    <div class="container">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="container">
      <p>&copy; 2024 TelcoX. All rights reserved.</p>
    </div>
  </footer>
</div>
