[pytest]
DJANGO_SETTINGS_MODULE = config.test_settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --tb=short
testpaths = apps tests
markers =
    unit: Unit tests
    integration: Integration tests (use real database)
    slow: Slow running tests
